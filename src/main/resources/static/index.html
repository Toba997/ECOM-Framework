<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build & Buy</title>
<style>
:root{--ink:#18212f;--muted:#64748b;--cream:#f8f3ea;--coral:#ee6c4d;--mint:#c9e8d5;--line:#ded8cc}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font-family:Georgia,serif}header{padding:28px max(24px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-weight:bold;font-size:24px}.brand span{color:var(--coral)}button{border:0;padding:11px 16px;border-radius:5px;background:var(--ink);color:white;cursor:pointer;font-weight:bold}main{max-width:1120px;margin:0 auto;padding:54px 24px}.intro{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:34px}.intro h1{font-size:clamp(38px,6vw,72px);line-height:.95;margin:0;max-width:650px}.intro p{color:var(--muted);font:18px/1.4 Arial,sans-serif;max-width:310px;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border:1px solid var(--line);padding:18px;border-radius:7px}.art{height:150px;background:var(--mint);display:grid;place-items:center;font-size:62px;border-radius:5px}.card h2{font-size:20px;margin:17px 0 6px}.meta{display:flex;justify-content:space-between;color:var(--muted);font:14px Arial,sans-serif}.price{color:var(--coral);font-weight:bold}.cart{position:fixed;right:24px;bottom:24px;background:white;border:1px solid var(--line);padding:18px 20px;width:280px;box-shadow:0 12px 35px #18212f22;border-radius:7px}.cart h3{margin:0 0 10px}.cart small{color:var(--muted);font:14px Arial,sans-serif}.checkout{width:100%;margin-top:14px;background:var(--coral)}#message{font:14px Arial,sans-serif;color:var(--muted);margin-top:12px}@media(max-width:800px){.intro{display:block}.intro p{margin-top:18px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.cart{position:static;width:auto;margin:24px}}
</style></head><body><header><div class="brand">Build<span>&</span>Buy</div><div id="cartCount">Cart 0</div></header><main><section class="intro"><h1>Ship something<br><i>good.</i></h1><p>Small tools for people who care about clean builds, useful software, and a little office banter.</p></section><section class="grid" id="products"></section><aside class="cart"><h3>Your cart</h3><div id="cartItems"><small>Your cart is empty.</small></div><button class="checkout" id="checkout">Checkout</button><div id="message"></div></aside></main>
<script>
const art={hoodie:'🧥',mug:'☕',sticker:'✦',keyboard:'⌨️'};let products=[];let cart={};
async function load(){products=await (await fetch('/api/store/products')).json();cart=await (await fetch('/api/store/cart')).json();render()}
function render(){document.getElementById('products').innerHTML=products.map(p=>`<article class="card"><div class="art">${art[p.id]||'📦'}</div><h2>${p.name}</h2><div class="meta"><span class="price">$${p.price.toFixed(2)}</span><span>${p.stock} in stock</span></div><button data-id="${p.id}" style="margin-top:16px;width:100%">Add to cart</button></article>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>add(b.dataset.id));let count=Object.values(cart).reduce((a,b)=>a+b,0);document.getElementById('cartCount').textContent=`Cart ${count}`;document.getElementById('cartItems').innerHTML=count?Object.entries(cart).map(([id,n])=>`<div>${products.find(p=>p.id===id)?.name||id} × ${n}</div>`).join(''):'<small>Your cart is empty.</small>'}
async function add(id){const r=await fetch('/api/store/cart/'+id,{method:'POST'});if(r.ok){cart=await r.json();render()}else document.getElementById('message').textContent='That item is out of stock.'}
document.getElementById('checkout').onclick=async()=>{const r=await fetch('/api/store/checkout',{method:'POST'});const d=await r.json();document.getElementById('message').textContent=r.ok?`Order placed: $${d.total.toFixed(2)}`:(d.message||'Checkout failed');if(r.ok)load()};load();
</script></body></html>
